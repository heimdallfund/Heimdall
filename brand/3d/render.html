<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:1200px;overflow:hidden}
body{background:radial-gradient(60% 55% at 50% 45%,#FFFFFF 0%,#EEF2FF 60%,#E3E9FF 100%)}
body.clear{background:transparent}
#shadow{position:absolute;left:50%;top:86%;width:520px;height:70px;margin-left:-260px;border-radius:50%;background:radial-gradient(closest-side,rgba(31,63,224,.28),rgba(31,63,224,0));filter:blur(6px)}
body.clear #shadow{display:none}
canvas{position:absolute;left:0;top:0}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><div id="shadow"></div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const params = new URLSearchParams(location.search);
const variant = params.get("v") || "gloss";
const rotY = parseFloat(params.get("ry") ?? "-0.42"), rotX = parseFloat(params.get("rx") ?? "0.16");
if (params.get("clear")) document.body.classList.add("clear");

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(1200, 1200);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = variant === "chrome" ? 1.4 : 0.4;

const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0.05, 6.2);

// Facet Shield: outline from the 64x64 logo, centre raised into a pyramid so every facet catches light differently.
const P = (x, y, z) => new THREE.Vector3((x - 32) / 26, (31 - y) / 26, z);
const D = 0.62, T = 0.2;
const outline = [[32, 4], [55, 12], [55, 30], [32, 60], [9, 30], [9, 12]];
const apex = P(32, 30, D), backC = P(32, 30, -T);
const front = outline.map(([x, y]) => P(x, y, 0)), back = outline.map(([x, y]) => P(x, y, -T));
// front facets in the logo's order (top-right, right, bottom-right, bottom-left, left, top-left)
const facetColors = ["#3355FF", "#1F3FE0", "#2A49F0", "#4A68FF", "#5C78FF", "#7C95FF"];
const pos = [], groups = [];
const tri = (a, b, c) => pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
for (let i = 0; i < 6; i++) { tri(front[(i + 1) % 6], front[i], apex); groups.push(i); }
for (let i = 0; i < 6; i++) { const a = front[i], b = front[(i + 1) % 6], c = back[(i + 1) % 6], d = back[i]; tri(a, c, d); tri(a, b, c); groups.push(6, 6); }
for (let i = 0; i < 6; i++) { tri(back[i], back[(i + 1) % 6], backC); groups.push(7); }
const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
geo.computeVertexNormals();
groups.forEach((m, i) => geo.addGroup(i * 3, 3, m));

function mats() {
  const C = (hex) => new THREE.Color(hex);
  if (variant === "pearl") {
    const f = ["#7C95FF", "#4A68FF", "#5C78FF", "#8EA3FF", "#A8BDFF", "#C3D1FF"].map((c) => new THREE.MeshPhysicalMaterial({ color: C(c), roughness: 0.3, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.1, sheen: 1, sheenColor: C("#ffffff"), iridescence: 0.6, iridescenceIOR: 1.3, flatShading: true }));
    const side = new THREE.MeshPhysicalMaterial({ color: C("#6F86F0"), roughness: 0.35, clearcoat: 1, flatShading: true });
    return [...f, side, side];
  }
  if (variant === "chrome") {
    const m = new THREE.MeshPhysicalMaterial({ color: C("#4F6BFF"), metalness: 0.85, roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.05, flatShading: true });
    return Array(8).fill(m);
  }
  if (variant === "matte") {
    const f = facetColors.map((c) => new THREE.MeshStandardMaterial({ color: C(c), roughness: 0.62, metalness: 0, flatShading: true }));
    const side = new THREE.MeshStandardMaterial({ color: C("#1A33C2"), roughness: 0.6, flatShading: true });
    return [...f, side, side];
  }
  // gloss: brand facets with a lacquer clearcoat
  const f = facetColors.map((c) => new THREE.MeshPhysicalMaterial({ color: C(c), roughness: 0.22, metalness: 0.15, clearcoat: 1, clearcoatRoughness: 0.06, flatShading: true }));
  const side = new THREE.MeshPhysicalMaterial({ color: C("#1A33C2"), roughness: 0.25, metalness: 0.2, clearcoat: 1, flatShading: true });
  return [...f, side, side];
}
const mesh = new THREE.Mesh(geo, mats());
const group = new THREE.Group(); group.add(mesh); scene.add(group);
group.rotation.set(rotX, rotY, 0);
group.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(mesh); const c = box.getCenter(new THREE.Vector3());
group.position.set(-c.x, -c.y + 0.08, 0);

// thin white seams between facets, like the flat logo
if (variant !== "chrome") {
  const seam = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
  const lines = [];
  for (let i = 0; i < 6; i++) lines.push(front[i], apex);
  const lg = new THREE.BufferGeometry().setFromPoints(lines.map((v) => v.clone().add(new THREE.Vector3(0, 0, 0)).multiplyScalar(1.002)));
  group.add(new THREE.LineSegments(lg, seam));
}

const key = new THREE.DirectionalLight(0xffffff, variant === "pearl" ? 1.6 : 2.3); key.position.set(-4, 5, 4); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe6ff, 0.9); fill.position.set(5, -2, 3); scene.add(fill);
const rim = new THREE.DirectionalLight(0xbfd0ff, 1.6); rim.position.set(3, 2, -4); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, variant === "matte" ? 0.35 : 0.15));

renderer.render(scene, camera);
window.frame = (ry, rx, dy = 0) => { group.rotation.set(rx, ry, 0); mesh.position.y = dy; renderer.render(scene, camera); };
window.__done = true;
</script></body></html>
