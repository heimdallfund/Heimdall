<!doctype html><html><head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@500&display=swap">
<style>body{margin:0}.f{display:none}.f.on{display:flex}</style></head><body>
<div id="avatar" class="f" style="width:1000px;height:1000px;background:#3355FF;align-items:center;justify-content:center"><img src="mark-white.svg" width="560" height="560"></div>
<div id="apple" class="f" style="width:180px;height:180px;background:#3355FF;align-items:center;justify-content:center"><img src="mark-white.svg" width="120" height="120"></div>
<div id="icon512" class="f" style="width:512px;height:512px;align-items:center;justify-content:center"><img src="mark.svg" width="512" height="512"></div>
<div id="fav32" class="f" style="width:32px;height:32px"><img src="mark.svg" width="32" height="32"></div>
<div id="fav16" class="f" style="width:16px;height:16px"><img src="mark.svg" width="16" height="16"></div>
<div id="token" class="f" style="width:512px;height:512px;border-radius:50%;background:#3355FF;align-items:center;justify-content:center;overflow:hidden"><img src="mark-white.svg" width="300" height="300"></div>
<div id="og" class="f" style="width:1200px;height:630px;background:#F7F9FF;flex-direction:column;justify-content:space-between;padding:72px;box-sizing:border-box;position:relative;overflow:hidden">
  <img src="mark.svg" width="560" height="560" style="position:absolute;right:-80px;top:35px;opacity:0.14">
  <div style="display:flex;align-items:center;gap:18px"><img src="mark.svg" width="72" height="72"><span style="font:600 42px Sora;letter-spacing:-1px;color:#1F2A44">Heimdall</span></div>
  <div style="font:700 66px/1.08 Sora;color:#1F2A44;letter-spacing:-2px;max-width:900px">The guardian layer for <span style="color:#3355FF">onchain agents.</span></div>
  <div style="font:500 26px Inter;color:#5A6683">Shield · Signals · Vaults — on Robinhood Chain</div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,#3355FF,#7C95FF,#A8BDFF)"></div>
</div>
<div id="banner" class="f" style="width:1500px;height:500px;background:linear-gradient(120deg,#EEF1FF 0%,#DCE4FF 60%,#C9D5FF 100%);align-items:center;justify-content:center;flex-direction:column;gap:20px;position:relative;overflow:hidden">
  <img src="mark.svg" width="520" height="520" style="position:absolute;right:60px;top:-10px;opacity:0.18">
  <img src="mark.svg" width="300" height="300" style="position:absolute;left:-60px;bottom:-110px;opacity:0.12">
  <div style="font:700 60px Sora;color:#1F2A44;position:relative;letter-spacing:-2px">Nothing gets signed <span style="color:#3355FF">unchecked.</span></div>
  <div style="font:500 24px Inter;color:#4A5675;position:relative">The guardian layer for onchain agents · Robinhood Chain</div>
</div>
<script>document.getElementById(location.hash.slice(1)).classList.add('on')</script>
</body></html>
