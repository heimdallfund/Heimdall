[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "heimdallfund"
version = "0.3.0"
description = "Heimdall Shield for Python: check Robinhood Chain transactions and signatures before your AI agent signs them"
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Heimdall", email = "hello@heimdall.fund" }]
keywords = ["robinhood-chain", "ai-agents", "web3", "security", "firewall", "transaction-simulation", "langchain", "crewai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "typing_extensions>=4.7; python_version<'3.11'"]

[project.urls]
Homepage = "https://heimdall.fund"
Documentation = "https://heimdall.fund/docs/sdk"
Source = "https://github.com/heimdallfund/Heimdall/tree/main/packages/sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/heimdallfund"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
